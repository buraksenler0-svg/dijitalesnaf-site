<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>Kontrol Merkezi · Digital Esnaf</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Nunito:wght@800&display=swap" media="print" onload="this.media='all'">
<style>:root{--bg:#F3F6F6;--kart:#fff;--kart2:#F7FAFA;--kart3:#EDF3F3;--cizgi:#E0E8E8;--cizgi2:#D1DCDC;--ayrac:#E8EEEE;--yazi:#122B30;--yazi2:#22393E;--etiket:#2C4448;--soluk:#566A6E;
 --yan:#0E4851;--yan2:#0B3C44;--yan-yazi:#D6E8E9;--yan-soluk:#9EC3C5;--yan-hover:rgba(255,255,255,.07);--yan-on:#1A7C77;
 --vurgu:#18807A;--vurgu-metin:#126C67;--vurgu-zemin:#E2F2F0;--vurgu-zemin2:#F0F8F7;--vurgu-cizgi:#B9DEDA;--basari:#1E7A4C;--basari-zemin:#E2F4E9;
 --sari:#F0B429;--sari-metin:#8A5A00;--sari-zemin:#FDF3DC;--tehlike:#B42318;--tehlike-zemin:#FDECEA;--tehlike-dolgu:#C2362B;
 --logo:#4CC0B5;--bf:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--lf:Nunito,"Nunito Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.5 var(--bf);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--vurgu-metin)}button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3,p{margin:0}
.ik{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--vurgu);outline-offset:2px;border-radius:6px}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid transparent;background:var(--vurgu);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn:hover{background:#13706B}.btn:disabled{opacity:.6;cursor:default}
.btn .ik{width:18px;height:18px}
.btn.ikinci{background:var(--kart);color:var(--yazi);border-color:var(--cizgi2)}.btn.ikinci:hover{background:var(--kart2)}
.btn.tehlike{background:var(--tehlike-dolgu)}.btn.tehlike:hover{background:#A92D23}
.btn.kucuk{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}.btn.kucuk .ik{width:16px;height:16px}
.btn.tam{width:100%}
.metin-dugme{border:0;background:none;padding:0;font-weight:700;color:var(--vurgu-metin);cursor:pointer;font-size:13.5px}
.donen{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:don .7s linear infinite;display:inline-block}
@keyframes don{to{transform:rotate(360deg)}}
/* alanlar */
.alan{display:flex;flex-direction:column;gap:7px}
.alan label,.etiket{font-weight:700;font-size:13.5px;color:var(--etiket)}
.alan small{font-size:12.5px;color:var(--soluk)}
input,select,textarea{width:100%;min-height:44px;padding:10px 13px;border:1px solid var(--cizgi2);border-radius:11px;background:var(--kart);outline:0;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--vurgu);box-shadow:0 0 0 3px rgba(24,128,122,.16)}
.ikonlu{position:relative}.ikonlu>.ik{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soluk);pointer-events:none;width:18px;height:18px}.ikonlu input{padding-left:42px}
.etiket-satir{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.onay{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}.onay input{width:18px;height:18px;min-height:0;accent-color:var(--vurgu)}
.hata{color:var(--tehlike);font-size:13.5px;font-weight:600}.hata:empty{display:none}
.k{color:var(--soluk)}
/* rozetler */
.rozet{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:6px;vertical-align:1px;white-space:nowrap}
.rozet.pro{background:var(--yan);color:#fff}.rozet.std{background:var(--kart3);color:var(--etiket);border:1px solid var(--cizgi)}.rozet.ucr{background:var(--basari-zemin);color:var(--basari)}
.rozet.sari{background:var(--sari-zemin);color:var(--sari-metin)}.rozet.kirmizi{background:var(--tehlike-zemin);color:var(--tehlike)}.rozet.yesil{background:var(--basari-zemin);color:var(--basari)}.rozet.gri{background:var(--kart3);color:var(--soluk)}
.sayac{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--sari);color:#2B1D00;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;margin-left:auto}
.durum-ok{color:var(--basari);font-weight:700}.durum-uyari{color:var(--sari-metin);font-weight:700}.durum-bitti{color:var(--tehlike);font-weight:700}
/* giriş */
#giris{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 80% -10%,#D5EEEA 0%,rgba(213,238,234,0) 70%),var(--bg)}
.g-kutu{width:100%;max-width:420px;background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;padding:32px 28px;box-shadow:0 30px 60px -36px rgba(14,72,81,.5);display:flex;flex-direction:column;gap:18px}
.g-logo{display:flex;align-items:center;gap:10px;color:var(--yan)}.g-logo b{font:800 21px/1 var(--lf);color:#224850}
.g-etiket{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--vurgu-metin);background:var(--vurgu-zemin);padding:4px 10px;border-radius:8px}
.g-kutu h1{font-size:26px;letter-spacing:-.02em}
.g-form{display:flex;flex-direction:column;gap:14px}
.g-alt{font-size:13px;color:var(--soluk);text-align:center}
/* kabuk */
.kabuk{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.yan{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--yan) 0%,var(--yan2) 100%);color:var(--yan-yazi);display:flex;flex-direction:column;padding:20px 14px 16px;gap:6px}
.yan-logo{display:flex;align-items:center;gap:10px;padding:2px 10px 4px;color:var(--logo);text-decoration:none}.yan-logo b{font:800 19px/1 var(--lf);color:#fff}
.yan-alt-baslik{margin:0 10px 14px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--yan-soluk)}
.yan nav{display:flex;flex-direction:column;gap:2px}
.km-men{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--yan-yazi);text-decoration:none;font-weight:700;font-size:14.5px}
.km-men:hover{background:var(--yan-hover)}.km-men.on{background:var(--yan-on);color:#fff}
.km-men .ik{width:19px;height:19px}
.yan-son{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 6px 0;display:flex;flex-direction:column;gap:10px}
.yan-hesap{font-size:12.5px;color:var(--yan-soluk);overflow-wrap:anywhere}.yan-hesap b{display:block;color:#fff;font-size:13.5px}
.yan-son .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}.yan-son .btn:hover{background:rgba(255,255,255,.14)}
.ana{min-width:0;padding:26px 32px 48px;max-width:1320px}
.bas{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.bas h1{font-size:27px;letter-spacing:-.02em}.bas p{color:var(--soluk);font-size:14px;margin-top:4px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:20px}
.kart>h2,.kart-bas h2{font-size:17px}
.kart-bas{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kart-bas p{font-size:13px;color:var(--soluk)}
.izgara2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.izgara3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
/* özet kartları */
.km-kpiler{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.km-kpi{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.km-kpi span{font-size:13px;font-weight:700;color:var(--etiket);display:flex;align-items:center;gap:7px}
.km-kpi span .ik{width:17px;height:17px;color:var(--vurgu-metin)}
.km-kpi b{font-size:26px;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km-kpi em{font-style:normal;font-size:12.5px;color:var(--soluk)}
/* grafik */
.grafik{position:relative}
.grafik svg{display:block;width:100%;height:auto;overflow:visible}
.grafik .ipucu{position:absolute;pointer-events:none;background:var(--yazi);color:#fff;font-size:12.5px;font-weight:700;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.grafik .ipucu small{display:block;font-weight:600;opacity:.75}
.grafik-ozet{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--soluk);margin-top:6px}.grafik-ozet b{color:var(--yazi)}
/* listeler */
.liste{display:flex;flex-direction:column}
.satir{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--ayrac)}
.satir:first-child{border-top:0}
.satir .b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.satir .b b{font-size:14.5px;overflow-wrap:anywhere}.satir .b>span,.satir .b>small{font-size:13px;color:var(--soluk);overflow-wrap:anywhere}.satir .b>b .kod{color:var(--soluk);font-size:13px}
.satir .islem{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.metin-kutu{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--kart2);border:1px solid var(--cizgi);font-size:14px;color:var(--yazi2);white-space:pre-wrap;overflow-wrap:anywhere}
.satir.yeni .b>b:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sari);margin-right:8px;vertical-align:1px}
.bos{padding:18px 4px;color:var(--soluk);font-size:14px}
.izgara3 .satir{flex-wrap:wrap}.izgara3 .satir .islem{flex:1 0 100%;justify-content:flex-start}
/* filtreler ve tablo */
.arac{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.arac .ara{flex:1 1 280px}
.arac select{width:auto;min-width:190px}
.filtre{display:flex;gap:6px;flex-wrap:wrap}
.filtre button{border:1px solid var(--cizgi2);background:var(--kart);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--etiket);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filtre button.on{background:var(--yan);border-color:var(--yan);color:#fff}
.filtre button i{font-style:normal;font-weight:800;opacity:.7}
.tablo-kap{overflow-x:auto;margin:0 -20px -20px;padding:0 20px 8px}
table.tablo{width:100%;border-collapse:collapse;font-size:13.5px;min-width:980px}
.tablo th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--soluk);font-weight:800;padding:10px 10px;border-bottom:1px solid var(--cizgi);white-space:nowrap}
.tablo td{padding:12px 10px;border-bottom:1px solid var(--ayrac);vertical-align:top}
.tablo tr.km-satir{cursor:pointer}.tablo tr.km-satir:hover td{background:var(--vurgu-zemin2)}
.tablo td b{font-size:14px}.tablo td small{display:block;color:var(--soluk);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.tablo .sag{text-align:right}
.tablo td.nw,.tablo td.nw small{white-space:nowrap}
.kod{font-weight:800;letter-spacing:.04em;color:var(--yazi2)}
.kartlar{display:none}
/* pencere */
#perde{position:fixed;inset:0;background:rgba(10,30,34,.42);display:grid;place-items:center;padding:16px;z-index:60}
.pencere{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:var(--kart);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
.pencere>*{flex-shrink:0}
.pencere h2{font-size:21px;letter-spacing:-.01em}
.pencere .alt{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.bilgi-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--cizgi);border:1px solid var(--cizgi);border-radius:12px;overflow:hidden}
.bilgi-izgara div{background:var(--kart);padding:10px 12px;min-width:0}.bilgi-izgara small{display:block;font-size:12px;color:var(--soluk);font-weight:700}.bilgi-izgara b{font-size:14px;overflow-wrap:anywhere}
.islem-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.iletisim{display:flex;gap:8px;flex-wrap:wrap}
/* ayarlar */
.form-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-izgara .tam{grid-column:1/-1}
.ayar-grup+.ayar-grup{margin-top:16px}
.ayar-grup h2{font-size:17px}.ayar-grup>p{font-size:13.5px;color:var(--soluk);margin:4px 0 14px}
/* bildirim */
#bildirim{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--yazi);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100vw - 32px)}
#bildirim.acik{opacity:1;transform:translate(-50%,0)}
.yukleniyor{display:flex;align-items:center;gap:10px;color:var(--soluk);padding:30px 4px}
/* duyarlı */
@media(max-width:1280px){.km-kpiler{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){.izgara3{grid-template-columns:1fr}.izgara2{grid-template-columns:1fr}}
@media(max-width:860px){
 .kabuk{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
 .yan{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px 0;gap:0}
 .yan-logo{padding:4px 4px 8px}.yan-alt-baslik{display:none}
 .yan{min-width:0}
 .yan nav{order:3;flex:1 0 100%;min-width:0;flex-direction:row;overflow-x:auto;gap:4px;padding:2px 28px 10px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
 .yan nav::-webkit-scrollbar{display:none}
 .km-men{flex:none;padding:8px 12px;font-size:13.5px}
 .yan-son{margin:0 0 6px auto;border:0;padding:0;flex-direction:row;align-items:center}
 .yan-hesap{display:none}
 .ana{padding:18px 16px 40px}
 .km-kpiler{grid-template-columns:repeat(2,minmax(0,1fr))}
 .km-kpi b{font-size:22px}
 .tablo-kap{display:none}.kartlar{display:flex;flex-direction:column}
 .form-izgara{grid-template-columns:1fr}
 .satir{flex-wrap:wrap}.satir .islem{flex:1 0 100%;justify-content:flex-start}
 .islem-izgara{grid-template-columns:1fr}
 .bas h1{font-size:23px}
}
</style>

function bitisSatir(i){const c=sahipCep(i);return `<div class="satir"><div class="b"><b>${esc(i.ad)}</b><span><span class="kod">${esc(kodGoster(i.kod))}</span> · ${i.odeme_bitis?'Ödenen süre':'Deneme'} · ${kalanGun(i.bitis)<=0?'bugün bitiyor':kalanGun(i.bitis)+' gün kaldı'}</span></div><div class="islem">${c?`<a class="btn ikinci kucuk" href="${esc(waLink(c,i.sahip))}" target="_blank" rel="noopener" aria-label="${esc(i.ad)} sahibine WhatsApp’tan yaz">${ik('mesaj')}WhatsApp</a>`:''}<button type="button" class="btn ikinci kucuk" data-id="${esc(i.id)}" onclick="yonet(this.dataset.id)">Aç</button></div></div>`}

/* ── grafikler: tek seri, tek renk, üzerine gelince değer ── */
function adimBul(m){const h=Math.max(1,m)/4,us=Math.pow(10,Math.floor(Math.log10(h))),o=h/us;return (o<=1?1:o<=2?2:o<=2.5?2.5:o<=5?5:10)*us}
function cubukGrafik(id,veri,aciklama,ekseniYaz,bosYazi){const W=520,H=200,sol=44,alt=24,ust=10,sag=6,n=veri.length;
 const max=Math.max(0,...veri.map(d=>d.v)),adim=Math.max(1,adimBul(max||1)),ymax=Math.max(adim,Math.ceil((max||1)/adim)*adim);
 const y=v=>ust+(H-ust-alt)*(1-v/ymax),gw=(W-sol-sag)/n,bw=Math.min(26,gw*.62);let s='';
 for(let k=0;k<=ymax+1e-9;k+=adim){if(!max&&k>0)break;const yy=y(k).toFixed(1);s+=`<line x1="${sol}" x2="${W-sag}" y1="${yy}" y2="${yy}" stroke="${k===0?'#C9D6D6':'#E8EEEE'}" stroke-width="1"/><text x="${sol-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#566A6E">${esc(ekseniYaz(k))}</text>`}
 veri.forEach((d,i)=>{const x=sol+gw*i+(gw-bw)/2,y0=y(0),yv=y(d.v),h=y0-yv,r=Math.min(4,h);
  if(h>0.5)s+=`<path d="M${x.toFixed(1)} ${y0.toFixed(1)}V${(yv+r).toFixed(1)}q0 -${r.toFixed(1)} ${r.toFixed(1)} -${r.toFixed(1)}H${(x+bw-r).toFixed(1)}q${r.toFixed(1)} 0 ${r.toFixed(1)} ${r.toFixed(1)}V${y0.toFixed(1)}Z" fill="${d.vurgu?'#0E4851':'#18807A'}"/>`;
  if(n<=8||i%2===(n-1)%2)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#566A6E">${esc(d.e)}</text>`;
  s+=`<rect class="vur" x="${(sol+gw*i).toFixed(1)}" y="${ust}" width="${gw.toFixed(1)}" height="${H-ust-alt}" fill="transparent" tabindex="0" data-i="${i}" aria-label="${esc(d.ip)}"><title>${esc(d.ip)}</title></rect>`});
 if(!max&&bosYazi)s+=`<text x="${(sol+(W-sol-sag)/2).toFixed(1)}" y="${((H-alt+ust)/2).toFixed(1)}" text-anchor="middle" font-size="13" fill="#566A6E">${esc(bosYazi)}</text>`;
 return `<div class="grafik" id="${id}" data-veri="${esc(JSON.stringify(veri.map((d,i)=>({ip:d.ip,alt:d.alt||'',x:sol+gw*i+gw/2,y:y(d.v)}))))}" data-w="${W}" data-h="${H}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aciklama)}">${s}</svg><div class="ipucu" hidden></div></div>`}
function grafikleriBagla(){document.querySelectorAll('.grafik').forEach(g=>{let v=[];try{v=JSON.parse(g.dataset.veri)}catch(e){}const ip=g.querySelector('.ipucu'),svg=g.querySelector('svg'),W=+g.dataset.w,H=+g.dataset.h;
 const goster=i=>{const d=v[i];if(!d)return;const r=svg.getBoundingClientRect(),gr=g.getBoundingClientRect();ip.innerHTML=`${esc(d.ip)}${d.alt?`<small>${esc(d.alt)}</small>`:''}`;ip.hidden=false;
  ip.style.left=(r.left-gr.left+d.x*r.width/W)+'px';ip.style.top=(r.top-gr.top+d.y*r.height/H)+'px'};
 g.querySelectorAll('.vur').forEach(x=>{const i=+x.dataset.i;x.addEventListener('mouseenter',()=>goster(i));x.addEventListener('focus',()=>goster(i));x.addEventListener('mouseleave',()=>ip.hidden=true);x.addEventListener('blur',()=>ip.hidden=true)})})}
function haftaBasi(x){const d=new Date(x.getFullYear(),x.getMonth(),x.getDate());const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return d}
function kayitGrafik(L){const bu=haftaBasi(new Date()),h=[];
 for(let i=11;i>=0;i--){const b=new Date(bu);b.setDate(b.getDate()-7*i);const s=new Date(b);s.setDate(s.getDate()+6);h.push({b,s,v:0})}
 L.forEach(i=>{const x=tarihNesne(i.created_at);if(!x)return;const hb=haftaBasi(x).getTime();const k=h.find(w=>w.b.getTime()===hb);if(k)k.v++});
 const veri=h.map((w,i)=>({v:w.v,e:w.b.getDate()+' '+AY[w.b.getMonth()],vurgu:i===h.length-1,ip:`${w.v} yeni işletme`,alt:`${w.b.getDate()} ${AY[w.b.getMonth()]} – ${w.s.getDate()} ${AY[w.s.getMonth()]}${i===h.length-1?' (bu hafta)':''}`}));
 const top=h.reduce((a,w)=>a+w.v,0);
 return cubukGrafik('kmGrafikKayit',veri,`Son 12 haftada ${top} yeni işletme; bu hafta ${h[11].v}.`,k=>sayi(k),'Son 12 haftada yeni kayıt yok')+`<p class="grafik-ozet"><span>Bu hafta <b>${sayi(h[11].v)}</b></span><span>12 haftada <b>${sayi(top)}</b></span></p>`}
function odemeGrafik(T){const n=new Date(),a=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);a.push({y:d.getFullYear(),m:d.getMonth(),v:0,adet:0})}
 T.filter(t=>t.durum==='onaylandi').forEach(t=>{const x=tarihNesne(t.sonuc_zaman||t.created_at);if(!x)return;const k=a.find(z=>z.y===x.getFullYear()&&z.m===x.getMonth());if(k){k.v+=+t.tutar||0;k.adet++}});
 const veri=a.map((z,i)=>({v:z.v,e:AY[z.m],vurgu:i===a.length-1,ip:para(z.v),alt:`${AY_UZUN[z.m]} ${z.y} · ${z.adet} ödeme`}));const top=a.reduce((s,z)=>s+z.v,0);
 return cubukGrafik('kmGrafikOdeme',veri,`Son 6 ayda onaylanan ödemeler toplam ${para(top)}; bu ay ${para(a[5].v)}.`,k=>kisaPara(k),'Son 6 ayda onaylanan ödeme yok')+`<p class="grafik-ozet"><span>Bu ay <b>${para(a[5].v)}</b></span><span>6 ayda <b>${para(top)}</b></span></p>`}

 const s=F.sira;return L.slice().sort((a,b)=>s==='ad'?String(a.ad).localeCompare(String(b.ad),'tr'):s==='bitis'?(a.ucretsiz-b.ucretsiz)||String(a.bitis).localeCompare(String(b.bitis)):String(b.created_at).localeCompare(String(a.created_at)))}
function listeHtml(){const L=suzulmus();if(!L.length)return '<p class="bos">Kayıt bulunamadı.</p>';
 const tablo=`<div class="tablo-kap"><table class="tablo"><thead><tr><th>İşletme</th><th>Sahip</th><th>Paket</th><th>Durum</th><th>Kayıt</th><th class="sag">Ekip</th><th class="sag">AI · bu ay</th><th>Son giriş</th></tr></thead><tbody>${L.map(i=>`<tr class="km-satir" data-id="${esc(i.id)}" tabindex="0" onclick="yonet(this.dataset.id)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();yonet(this.dataset.id)}">
  <td><b>${esc(i.ad)}</b><small><span class="kod">${esc(kodGoster(i.kod))}</span> · ${esc(SEKTOR[i.sektor]||i.sektor||'')}</small></td>
  <td>${esc(i.sahip||'—')}${sahipCep(i)?`<small>${esc(telYaz(sahipCep(i)))}</small>`:''}${i.eposta?`<small>${esc(i.eposta)}</small>`:''}</td>
  <td>${paketRozet(i)}${+i.bekleyen_talep?` <span class="rozet sari">${+i.bekleyen_talep} talep</span>`:''}</td>
  <td class="nw">${durumHtml(i)}</td><td class="nw">${tarih(i.created_at)}</td>

 const kartlar=`<div class="kartlar">${L.map(i=>`<div class="satir km-kart"><div class="b"><b>${esc(i.ad)} ${paketRozet(i)}</b><span><span class="kod">${esc(kodGoster(i.kod))}</span> · ${esc(i.sahip||'—')}${sahipCep(i)?' · '+esc(telYaz(sahipCep(i))):''}</span><small>${durumHtml(i).replace(/<small>/g,' · ').replace(/<\/small>/g,'')}</small></div><div class="islem"><button type="button" class="btn ikinci kucuk" data-id="${esc(i.id)}" onclick="yonet(this.dataset.id)">Yönet</button></div></div>`).join('')}</div>`;

 pencere(`<div><h2>${esc(i.ad)}</h2><p class="k" style="margin-top:4px"><span class="kod">${esc(kodGoster(i.kod))}</span> · ${esc(SEKTOR[i.sektor]||i.sektor||'')}</p></div>

 const yeni=N.filter(x=>!x.okundu),L=F.oneri==='yeni'?yeni:N;
 return bas('Öneriler',`İşletmelerin “İstek ve öneri” sayfasından gelenler · ${guncelYazi()}`)+`<section class="kart"><div class="filtre" role="group" aria-label="Öneriler">${[['yeni','Okunmamış',yeni.length],['tumu','Tümü',N.length]].map(([f,a,n])=>`<button type="button" data-f="${f}" class="${F.oneri===f?'on':''}" aria-pressed="${F.oneri===f}" onclick="F.oneri='${f}';ciz()">${a} <i>${n}</i></button>`).join('')}</div>
 <div class="liste" style="margin-top:8px">${L.length?L.map(oneriSatir).join(''):`<p class="bos">${F.oneri==='yeni'?'Okunmamış öneri yok.':'Henüz öneri gelmedi.'}</p>`}</div></section>`};
async function okundu(id,deger,btn){const bit=bekle(btn,'');const r=await rpcDene('kurucu_oneri_okundu',{p_id:id,p_okundu:deger});bit();if(r.error){bildir(hataTR(r.error.message));return}
 const o=dizi(D.oneriler).find(x=>x.id===id);if(o&&o.okundu!==deger){o.okundu=deger;if(D.ozet&&!D.ozet.hata)D.ozet.okunmamis_oneri=Math.max(0,(+D.ozet.okunmamis_oneri||0)+(deger?-1:1))}ciz()}

/* ── ayarlar ── */
const ibanYaz=s=>String(s||'').replace(/\s/g,'').toUpperCase().replace(/(.{4})/g,'$1 ').trim();
SAYFA.ayarlar=()=>{const a=D.ayar;if(!a)return bas('Ayarlar',guncelYazi())+yukleniyorHtml;if(a.hata)return bas('Ayarlar','')+hataHtml(a.hata);
 const al=(id,et,v,ek)=>`<div class="alan${ek&&ek.tam?' tam':''}"><label for="${id}">${et}</label><input id="${id}" ${ek&&ek.tip?`type="${ek.tip}"`:'type="number" min="0" step="1" inputmode="numeric"'} value="${esc(v??'')}"${ek&&ek.ph?` placeholder="${esc(ek.ph)}"`:''}${ek&&ek.attr?' '+ek.attr:''}>${ek&&ek.not?`<small>${ek.not}</small>`:''}</div>`;
 return bas('Ayarlar','Fiyatlar, sınırlar ve ödeme bilgileri; bütün işletmeler için geçerli')+`<form class="kart" novalidate onsubmit="event.preventDefault();ayarKaydet()">
  <div class="ayar-grup"><h2>Paket fiyatları</h2><p>Kayıt ekranında, tanıtım sayfasında ve “Paket ve ödeme”de görünür.</p><div class="form-izgara">${al('krFS','Standart (TL/ay)',a.fiyat_standart,{attr:'min="1"'})}${al('krFP','Pro (TL/ay)',a.fiyat_pro,{attr:'min="1"'})}</div></div>
  <div class="ayar-grup"><h2>AI asistan</h2><p>İşletme başına aylık soru hakkı. Deneme süresindeki işletmeler en fazla “deneme” hakkı kadar sorar. Günlük toplam sınır, beklenmedik AI masrafına karşı sigortadır.</p><div class="form-izgara">${al('krAS','Aylık hak · Standart',a.ai_standart)}${al('krAP','Aylık hak · Pro',a.ai_pro)}${al('krAD','Deneme hakkı',a.ai_deneme,{ph:'Boş: paketin hakkı'})}${al('krAG','Günlük toplam sınır',a.ai_gunluk,{ph:'Boş: sınırsız',attr:'min="1"'})}</div></div>
  <div class="ayar-grup"><h2>Şube sınırları</h2><p>Pakette açılabilecek şube sayısı; Pro’da boş bırakırsanız sınırsız olur.</p><div class="form-izgara">${al('krSS','Standart',a.sube_standart??1,{attr:'min="1"'})}${al('krSP','Pro',a.sube_pro,{ph:'Boş: sınırsız',attr:'min="1"'})}</div></div>
  <div class="ayar-grup"><h2>Ödeme bilgileri</h2><p>Müşterinin “Paket ve ödeme” ekranında görünür.</p><div class="form-izgara">
   ${al('krIban','IBAN',ibanYaz(a.iban||''),{tip:'text',tam:1,ph:'TR00 0000 0000 0000 0000 0000 00',attr:'autocapitalize="characters" spellcheck="false"'})}
   ${al('krAlici','Alıcı adı',a.alici||'',{tip:'text',ph:'Hesap sahibinin adı soyadı'})}${al('krBanka','Banka',a.banka||'',{tip:'text',ph:'Örn. Ziraat Bankası'})}
   ${al('krIlet','İletişim (WhatsApp veya telefon)',a.iletisim||'',{tip:'tel',ph:'0555 123 45 67'})}${al('krNot','Ödeme notu (isteğe bağlı)',a.odeme_notu||'',{tip:'text',ph:'Örn. Açıklamaya işletme kodunuzu yazın'})}</div></div>
  <div style="margin-top:18px;display:flex;gap:10px"><button class="btn" id="krABtn" type="submit">${ik('ok')}Kaydet</button></div></form>`};
async function ayarKaydet(){const n=(i,tam)=>{const v=$(i).value.trim().replace(',','.');return v===''?null:tam?Math.round(+v):+v};
 const p={fiyat_standart:n('krFS'),fiyat_pro:n('krFP'),ai_standart:n('krAS',1),ai_pro:n('krAP',1),ai_deneme:n('krAD',1),ai_gunluk:n('krAG',1),sube_standart:n('krSS',1),sube_pro:n('krSP',1),iban:$('krIban').value,alici:$('krAlici').value,banka:$('krBanka').value,iletisim:$('krIlet').value,odeme_notu:$('krNot').value};
 if(!(p.fiyat_standart>0)||!(p.fiyat_pro>0)){bildir('Fiyatlar sıfırdan büyük olmalı');return}
 if((p.ai_standart!=null&&p.ai_standart<0)||(p.ai_pro!=null&&p.ai_pro<0)||(p.ai_deneme!=null&&p.ai_deneme<0)){bildir('Soru hakkı eksi olamaz');return}
 if(p.ai_gunluk!=null&&!(p.ai_gunluk>=1)){bildir('Günlük AI sınırı en az 1 olmalı');return}
 if((p.sube_standart!=null&&!(p.sube_standart>=1))||(p.sube_pro!=null&&!(p.sube_pro>=1))){bildir('Şube sınırı en az 1 olmalı');return}
 const ib=String(p.iban||'').replace(/\s/g,'').toUpperCase();if(ib&&!/^TR\d{24}$/.test(ib)){bildir('IBAN TR ile başlamalı ve 26 karakter olmalı');$('krIban').focus();return}
 const bit=bekle($('krABtn'),'Kaydediliyor…');const r=await rpcDene('kurucu_ayar_kaydet',{p});bit();
 if(r.error){bildir(hataTR(r.error.message));return}D.ayar=r.data||D.ayar;bildir('Kaydedildi');ciz()}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
basla();
