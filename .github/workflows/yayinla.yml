# Dijital Esnaf AI · siteyi Cloudflare Pages'e yayınlar
# Her güncellemede (site/ klasörü değişince) kendiliğinden çalışır; Actions sekmesinden elle de çalıştırılabilir.
# Gerekli gizli bilgi (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN
#   (Cloudflare > My Profile > API Tokens > Create Custom Token > Account · Cloudflare Pages · Edit)
# İsteğe bağlı: CLOUDFLARE_ACCOUNT_ID (yazılmazsa anahtarın bağlı olduğu hesap kullanılır)
name: Siteyi yayınla
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/yayinla.yml']
  workflow_dispatch:
concurrency:
  group: yayin
  cancel-in-progress: false
jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJE: dijitalesnaf
      HESAP_NO: ""   # Cloudflare hesap numarası (gizli değildir; panel adresinde görünür)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare hesabını ve ana dalı bul
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HESAP_GIZLI: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN adlı gizli bilgi eklenmemiş (Settings > Secrets and variables > Actions)"; exit 1; fi
          API=https://api.cloudflare.com/client/v4
          HESAP="${HESAP_GIZLI:-${HESAP_NO:-}}"
          if [ -z "$HESAP" ]; then
            Y=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/accounts")
            HESAP=$(echo "$Y" | jq -r '.result[0].id // empty')
            [ -n "$HESAP" ] || echo "Hesap listesi alınamadı: $(echo "$Y" | jq -c '.errors')"
          fi
          if [ -z "$HESAP" ]; then echo "::error::Anahtarla Cloudflare hesabı bulunamadı. Anahtarı Account > Cloudflare Pages > Edit izniyle yeniden oluşturun ya da CLOUDFLARE_ACCOUNT_ID ekleyin."; exit 1; fi
          YANIT=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/accounts/$HESAP/pages/projects/$PROJE")
          DAL=$(echo "$YANIT" | jq -r '.result.production_branch // empty')
          if [ -z "$DAL" ]; then echo "::error::'$PROJE' Pages projesi bulunamadı ya da anahtarın izni yok: $(echo "$YANIT" | jq -c '.errors')"; exit 1; fi
          echo "hesap=$HESAP" >> "$GITHUB_OUTPUT"
          echo "dal=$DAL" >> "$GITHUB_OUTPUT"
          echo "Proje: $PROJE · ana dal: $DAL"
      - name: Siteyi yükle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.hesap }}
        run: npx --yes wrangler@4 pages deploy site --project-name="$PROJE" --branch="${{ steps.cf.outputs.dal }}" --commit-dirty=true
